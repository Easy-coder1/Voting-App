<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Church E-Voting System</title>
</head>
<body class="bg-gray-50 flex flex-col min-h-screen">
    <!-- Navbar -->
    <nav class="bg-church-600 shadow-md">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between h-16 items-center">
                <div class="flex-shrink-0 flex items-center">
                    <img src="/images/NUTFS.png" alt="Church Logo" class="h-10 w-auto rounded-md shadow-sm bg-white p-1">
                    <span class="ml-3 text-xl font-extrabold text-white tracking-tight">Church E-Voting</span>
                </div>
                <div class="flex space-x-4">
                    <a href="/pages/login.html" class="text-white hover:text-church-100 px-4 py-2 rounded-full text-sm font-medium transition active:scale-95">Login</a>
                    <a href="/pages/register.html" class="bg-white text-church-700 hover:bg-gray-50 px-5 py-2 rounded-full text-sm font-bold shadow-soft transition active:scale-95">Register</a>
                </div>
            </div>
        </div>
    </nav>

    <!-- Hero Section -->
    <main class="flex-grow flex items-center justify-center bg-gray-50 px-4 sm:px-6 lg:px-8 animate-fade-in py-12">
        <div class="max-w-md w-full space-y-8 text-center bg-white p-10 rounded-[2.5rem] shadow-soft-lg border border-gray-100">
            <div>
                <img src="/images/NUTFS.png" alt="Church Logo" class="mx-auto h-24 w-auto drop-shadow-md rounded-xl">
                <h2 class="mt-8 text-4xl font-extrabold text-gray-900 tracking-tight leading-tight">
                    Secure & Transparent <br><span class="text-church-600">Church Elections</span>
                </h2>
                <p class="mt-5 text-base text-gray-500 leading-relaxed">
                    Participate in our digital voting process securely from anywhere. Your voice matters.
                </p>
            </div>
            <div class="flex flex-col space-y-4 pt-6">
                <a href="/pages/register.html" class="w-full flex justify-center py-4 px-6 border border-transparent rounded-full shadow-soft text-base font-bold text-white bg-church-600 hover:bg-church-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-church-500 transition-all active:scale-95">
                    Get Started (Register)
                </a>
                <a href="/pages/login.html" class="w-full flex justify-center py-4 px-6 border-2 border-gray-200 rounded-full text-base font-bold text-gray-700 bg-white hover:bg-gray-50 hover:border-gray-300 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-church-500 transition-all active:scale-95">
                    I already have an account
                </a>
            </div>
        </div>
    </main>

    <footer class="bg-gray-800 text-center py-6 text-sm text-gray-400">
        <p>&copy; 2026 Church E-Voting System. All rights reserved.</p>
    </footer>

    <script type="module" src="/src/main.js"></script>
</body>
</html>
