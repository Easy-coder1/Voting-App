<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NUTFS E-Voting System</title>
</head>
<body class="bg-slate-50 flex flex-col min-h-screen relative overflow-x-hidden">
    <!-- Ambient Backdrop Glows -->
    <div class="glow-aura w-[350px] h-[350px] bg-indigo-200/40 top-[-100px] right-[-50px] animate-glow-pulse"></div>
    <div class="glow-aura w-[300px] h-[300px] bg-violet-200/30 bottom-[50px] left-[-100px] animate-glow-pulse" style="animation-delay: -3s;"></div>

    <!-- Navbar -->
    <nav class="sticky top-0 z-50 bg-white/70 backdrop-blur-md border-b border-slate-200/40">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between h-20 items-center">
                <div class="flex items-center space-x-3">
                    <img src="/images/NUTFS.png" alt="NUTFS Logo" class="h-10 w-auto rounded-lg shadow-sm bg-white p-1">
                    <span class="text-xl font-black text-slate-900 tracking-tight bg-gradient-to-r from-church-700 to-church-500 bg-clip-text text-transparent hidden sm:inline">NUTFS E-Voting</span>
                </div>
                <div class="flex items-center space-x-3">
                    <a href="/pages/login.html" class="text-slate-600 hover:text-church-600 px-5 py-2.5 rounded-full text-sm font-semibold transition-all duration-300 hover:bg-slate-100/50 active:scale-95">Login</a>
                    <a href="/pages/register.html" class="bg-gradient-to-r from-church-600 to-church-500 hover:from-church-500 hover:to-church-400 text-white px-6 py-2.5 rounded-full text-sm font-bold shadow-premium hover:shadow-premium-lg transition-all duration-300 active:scale-95">Register</a>
                </div>
            </div>
        </div>
    </nav>

    <!-- Hero Section -->
    <main class="flex-grow flex items-center justify-center px-4 sm:px-6 lg:px-8 animate-fade-in py-16 relative z-10">
        <div class="max-w-md w-full space-y-8 text-center bg-white/85 backdrop-blur-md p-8 sm:p-10 rounded-5xl shadow-premium border border-white/50">
            <div>

                <img src="/images/NUTFS.png" alt="NUTFS Logo" class="mx-auto h-24 w-auto drop-shadow-md rounded-2xl mb-8">
                
                <h2 class="text-4xl font-extrabold text-slate-900 tracking-tight leading-none">
                    Secure & Transparent <br>
                    <span class="bg-gradient-to-r from-church-600 to-church-500 bg-clip-text text-transparent">NUTFS Elections</span>
                </h2>
                <p class="mt-4 text-base text-slate-500 leading-relaxed max-w-sm mx-auto">
                    Participate in our secure digital voting process. Your voice forms our leadership.
                </p>
            </div>
            
            <div class="flex flex-col space-y-3.5 pt-6">
                <a href="/pages/register.html" class="w-full flex justify-center py-4 px-6 rounded-full text-base font-bold text-white bg-gradient-to-r from-church-600 to-church-500 hover:from-church-500 hover:to-church-400 shadow-premium hover:shadow-premium-lg transition-all duration-300 active:scale-95">
                    Get Started (Register)
                </a>
                <a href="/pages/login.html" class="w-full flex justify-center py-4 px-6 border border-slate-200 rounded-full text-base font-bold text-slate-700 bg-white hover:bg-slate-50 hover:border-slate-300 transition-all duration-300 active:scale-95">
                    I already have an account
                </a>
            </div>
        </div>
    </main>

    <footer class="bg-slate-900 text-center py-6 text-sm text-slate-400 border-t border-slate-800">
                    <p>&copy; 2026 NUTFS E-Voting System. All rights reserved.</p>
    </footer>

    <script type="module" src="/src/main.js"></script>
</body>
</html>
