<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Register - NUTFS E-Voting System</title>
</head>
<body class="bg-cosmic-dark flex items-center justify-center min-h-[100dvh] min-h-screen py-8 sm:py-12 px-4 sm:px-6 lg:px-8 relative overflow-hidden">
    <!-- Ambient Background Glows -->
    <div class="glow-aura w-[250px] sm:w-[350px] h-[250px] sm:h-[350px] bg-indigo-500/10 top-[-50px] right-[-50px] animate-glow-pulse"></div>
    <div class="glow-aura w-[200px] sm:w-[300px] h-[200px] sm:h-[300px] bg-violet-600/10 bottom-[-50px] left-[-50px] animate-glow-pulse" style="animation-delay: -3s;"></div>

    <div class="max-w-md w-full space-y-6 sm:space-y-8 glass-panel-dark p-6 sm:p-10 rounded-4xl sm:rounded-5xl animate-fade-in relative z-10 pb-safe">
        <div class="text-center sm:text-left">
            <div class="flex items-center justify-between mb-6">
                <a href="/" class="inline-flex items-center text-sm font-bold text-slate-400 hover:text-white transition duration-300">
                    <svg class="mr-2 w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18"></path></svg>
                    Back to Home
                </a>
            </div>
            <!-- Logo -->
            <div class="flex justify-center sm:justify-start mb-4">
                <img src="/images/NUTFS.png" alt="NUTFS Logo" class="h-14 w-auto sm:h-16 rounded-2xl shadow-premium bg-black/20 p-2">
            </div>
            <h2 class="text-2xl sm:text-3xl font-black text-white tracking-tight">
                Register to Vote
            </h2>
            <p class="mt-2 text-sm text-slate-400">
                Already have an account?
                <a href="/pages/login.html" class="font-bold text-church-400 hover:text-church-300 transition duration-300">
                    Sign in
                </a>
            </p>
        </div>
        
        <!-- Alerts dynamically styled in JS -->
        <div id="alert-container" class="hidden rounded-2xl p-4 mb-4 border transition-all duration-300 text-sm font-semibold">
            <div class="flex items-center space-x-2.5">
                <div class="flex-shrink-0" id="alert-icon-container">
                    <!-- Dynamic Alert Icon -->
                </div>
                <div class="flex-1">
                    <p id="alert-message" class="leading-snug"></p>
                </div>
            </div>
        </div>

        <form id="register-form" class="mt-8 space-y-6">
            <div class="space-y-4">
                <!-- First & Last Name - stacked on mobile, side-by-side on sm+ -->
                <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                    <div class="relative">
                        <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none text-slate-400">
                            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"></path></svg>
                        </div>
                        <label for="first-name" class="sr-only">First Name</label>
                        <input id="first-name" name="first_name" type="text" required class="premium-input-dark pl-12" placeholder="First Name">
                    </div>
                    <div class="relative">
                        <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none text-slate-400">
                            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"></path></svg>
                        </div>
                        <label for="last-name" class="sr-only">Last Name</label>
                        <input id="last-name" name="last_name" type="text" required class="premium-input-dark pl-12" placeholder="Last Name">
                    </div>
                </div>
                <div class="relative">
                    <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none text-slate-400">
                        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 12a4 4 0 10-8 0 4 4 0 008 0zm0 0v1.5a2.5 2.5 0 005 0V12a9 9 0 10-9 9m4.5-1.206a8.959 8.959 0 01-4.5 1.206"></path></svg>
                    </div>
                    <label for="email-address" class="sr-only">Email address</label>
                    <input id="email-address" name="email" type="email" autocomplete="email" required class="premium-input-dark pl-12" placeholder="Email address">
                </div>
                <div class="relative">
                    <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none text-slate-400">
                        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"></path></svg>
                    </div>
                    <label for="password" class="sr-only">Create Password</label>
                    <input id="password" name="password" type="password" autocomplete="new-password" required class="premium-input-dark pl-12 pr-12" placeholder="Create Password" minlength="6">
                    <button type="button" id="toggle-password" class="absolute inset-y-0 right-0 pr-4 flex items-center text-slate-400 hover:text-slate-300 transition-colors duration-200" aria-label="Show password" tabindex="-1">
                        <svg id="toggle-password-icon" class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path>
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"></path>
                        </svg>
                    </button>
                </div>
                <div class="relative">
                    <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none text-slate-400">
                        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"></path></svg>
                    </div>
                    <label for="verify-password" class="sr-only">Verify Password</label>
                    <input id="verify-password" name="verify_password" type="password" autocomplete="new-password" required class="premium-input-dark pl-12 pr-12" placeholder="Verify Password" minlength="6">
                    <button type="button" id="toggle-verify-password" class="absolute inset-y-0 right-0 pr-4 flex items-center text-slate-400 hover:text-slate-300 transition-colors duration-200" aria-label="Show password" tabindex="-1">
                        <svg id="toggle-verify-password-icon" class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path>
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"></path>
                        </svg>
                    </button>
                </div>
            </div>

            <div>
                <button type="submit" id="submit-btn" class="w-full flex justify-center py-4 px-6 rounded-full text-base font-bold text-white bg-gradient-to-r from-church-600 to-church-500 hover:from-church-500 hover:to-church-400 shadow-premium hover:shadow-premium-lg transition-all duration-300 active:scale-95">
                    <span id="submit-btn-text">Complete Registration</span>
                    <svg id="submit-btn-spinner" class="hidden w-5 h-5 ml-2 animate-spin" fill="none" viewBox="0 0 24 24">
                        <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                        <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4z"></path>
                    </svg>
                </button>
            </div>
        </form>
    </div>

    <script type="module" src="/src/js/auth.js"></script>
    <script type="module" src="/src/main.js"></script>
</body>
</html>
