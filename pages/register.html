<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Register — NUTFS E‑Voting</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=Outfit:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
</head>
<body class="bg-slate-50 flex flex-col min-h-screen relative overflow-x-hidden">

    <!-- Ambient Backdrop Glows -->
    <div class="glow-aura w-[350px] h-[350px] bg-church-200/40 top-[-100px] right-[-80px] animate-glow-pulse"></div>
    <div class="glow-aura w-[280px] h-[280px] bg-violet-200/30 bottom-[0px] left-[-80px] animate-glow-pulse" style="animation-delay:-3s;"></div>

    <div class="flex flex-1 relative z-10">

        <!-- Left: Brand panel (desktop only) -->
        <div class="hidden lg:flex lg:w-1/2 bg-gradient-to-br from-church-600 via-church-700 to-violet-800 items-center justify-center p-12 relative overflow-hidden">
            <div class="absolute w-[400px] h-[400px] rounded-full bg-white/5 top-[-80px] left-[-80px]"></div>
            <div class="absolute w-[300px] h-[300px] rounded-full bg-white/5 bottom-[-60px] right-[-60px]"></div>

            <div class="relative z-10 max-w-md text-center text-white">
                <img src="/images/NUTFS.png" alt="NUTFS Logo" class="h-20 w-auto mx-auto mb-8 rounded-2xl bg-white/10 p-3 backdrop-blur-sm">
                <h1 class="font-heading text-3xl font-black leading-tight mb-4">
                    Join NUTFS E‑Voting
                </h1>
                <p class="text-church-200 text-base leading-relaxed mb-8">
                    Create your account to participate in secure, transparent elections. It takes less than a minute to get started.
                </p>
                <div class="flex items-center justify-center gap-6 text-sm text-church-200/80">
                    <div class="flex items-center gap-2">
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m5.618-4.016A11.955 11.955 0 0112 2.944a11.955 11.955 0 01-8.618 3.04A12.02 12.02 0 003 9c0 5.591 3.824 10.29 9 11.622 5.176-1.332 9-6.03 9-11.622 0-1.042-.133-2.052-.382-3.016z"/></svg>
                        Secure
                    </div>
                    <div class="flex items-center gap-2">
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z"/></svg>
                        Fast
                    </div>
                    <div class="flex items-center gap-2">
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"/></svg>
                        Private
                    </div>
                </div>
            </div>
        </div>

        <!-- Right: Register form -->
        <div class="flex-1 flex items-center justify-center px-4 sm:px-8 py-10 sm:py-16">
            <div class="w-full max-w-md animate-fade-in">

                <!-- Mobile logo -->
                <div class="flex justify-center mb-6 lg:hidden">
                    <a href="/" class="flex items-center gap-2">
                        <img src="/images/NUTFS.png" alt="NUTFS Logo" class="h-12 w-auto rounded-xl shadow-sm bg-white p-1 border border-slate-200/50">
                    </a>
                </div>

                <!-- Back link -->
                <a href="/" class="inline-flex items-center text-sm font-semibold text-slate-400 hover:text-slate-700 transition-colors mb-6">
                    <svg class="mr-1.5 w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18"/></svg>
                    Back to Home
                </a>

                <!-- Step Indicator -->
                <div class="flex items-center gap-2 mb-8" id="step-indicator">
                    <div class="flex-1 h-1 rounded-full bg-church-500 transition-all duration-500 step-bar" data-step="1"></div>
                    <div class="flex-1 h-1 rounded-full bg-slate-200 transition-all duration-500 step-bar" data-step="2"></div>
                    <div class="flex-1 h-1 rounded-full bg-slate-200 transition-all duration-500 step-bar" data-step="3"></div>
                </div>

                <div>
                    <h2 class="font-heading text-2xl sm:text-3xl font-black text-slate-900 tracking-tight">Create Account</h2>
                    <p class="mt-2 text-sm text-slate-500">
                        Already registered?
                        <a href="/pages/login.html" class="font-bold text-church-600 hover:text-church-500 transition-colors">Sign in</a>
                    </p>
                </div>

                <!-- Alerts -->
                <div id="alert-container" class="hidden rounded-2xl p-4 mt-6 border transition-all duration-300 text-sm font-semibold">
                    <div class="flex items-center space-x-2.5">
                        <div class="flex-shrink-0" id="alert-icon-container"></div>
                        <div class="flex-1"><p id="alert-message" class="leading-snug"></p></div>
                    </div>
                </div>

                <form id="register-form" class="mt-8 space-y-5">
                    <div class="grid grid-cols-2 gap-4">
                        <div class="relative m-field">
                            <input id="first-name" name="first_name" type="text" required placeholder=" " class="peer">
                            <label for="first-name" class="peer-focus:text-church-600 peer-focus:font-semibold peer-not-placeholder-shown:text-church-600 peer-not-placeholder-shown:font-semibold">First Name</label>
                        </div>
                        <div class="relative m-field">
                            <input id="last-name" name="last_name" type="text" required placeholder=" " class="peer">
                            <label for="last-name" class="peer-focus:text-church-600 peer-focus:font-semibold peer-not-placeholder-shown:text-church-600 peer-not-placeholder-shown:font-semibold">Last Name</label>
                        </div>
                    </div>

                    <div class="relative m-field">
                        <input id="email-address" name="email" type="email" autocomplete="email" required placeholder=" " class="peer">
                        <label for="email-address" class="peer-focus:text-church-600 peer-focus:font-semibold peer-not-placeholder-shown:text-church-600 peer-not-placeholder-shown:font-semibold">Email Address</label>
                    </div>

                    <div>
                        <div class="relative m-field">
                            <input id="password" name="password" type="password" autocomplete="new-password" required placeholder=" " minlength="6" class="peer pr-12">
                            <label for="password" class="peer-focus:text-church-600 peer-focus:font-semibold peer-not-placeholder-shown:text-church-600 peer-not-placeholder-shown:font-semibold">Create Password</label>
                            <button type="button" id="toggle-password" class="absolute inset-y-0 right-0 pr-4 flex items-center text-slate-400 hover:text-slate-600 transition-colors" aria-label="Show password" tabindex="-1">
                                <svg id="toggle-password-icon" class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path>
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"></path>
                                </svg>
                            </button>
                        </div>
                        <!-- Password Strength -->
                        <div id="password-strength" class="mt-2 hidden">
                            <div class="m-strength-bar">
                                <div id="strength-fill" class="m-strength-bar-fill"></div>
                            </div>
                            <p id="strength-text" class="m-strength-text mt-1"></p>
                        </div>
                    </div>

                    <div>
                        <div class="relative m-field">
                            <input id="verify-password" name="verify_password" type="password" autocomplete="new-password" required placeholder=" " minlength="6" class="peer pr-12">
                            <label for="verify-password" class="peer-focus:text-church-600 peer-focus:font-semibold peer-not-placeholder-shown:text-church-600 peer-not-placeholder-shown:font-semibold">Verify Password</label>
                            <button type="button" id="toggle-verify-password" class="absolute inset-y-0 right-0 pr-4 flex items-center text-slate-400 hover:text-slate-600 transition-colors" aria-label="Show password" tabindex="-1">
                                <svg id="toggle-verify-password-icon" class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path>
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"></path>
                                </svg>
                            </button>
                        </div>
                        <!-- Password Match Indicator -->
                        <p id="password-match" class="hidden mt-1.5 text-xs font-semibold"></p>
                    </div>

                    <button type="submit" id="submit-btn" class="w-full flex justify-center items-center py-4 px-6 rounded-full text-base font-bold text-white bg-gradient-to-r from-church-600 to-church-500 hover:from-church-500 hover:to-church-400 shadow-premium hover:shadow-premium-lg transition-all duration-300 active:scale-95 mt-2">
                        <span id="submit-btn-text">Complete Registration</span>
                        <svg id="submit-btn-spinner" class="hidden w-5 h-5 ml-2 animate-spin" fill="none" viewBox="0 0 24 24">
                            <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                            <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4z"></path>
                        </svg>
                    </button>
                </form>
            </div>
        </div>
    </div>

    <script type="module" src="/src/js/auth.js"></script>
    <script type="module" src="/src/main.js"></script>
    <script>
        // Password strength meter
        const passwordInput = document.getElementById('password');
        const strengthWrap = document.getElementById('password-strength');
        const strengthFill = document.getElementById('strength-fill');
        const strengthText = document.getElementById('strength-text');
        const verifyInput = document.getElementById('verify-password');
        const matchIndicator = document.getElementById('password-match');

        function getStrength(pw) {
            let score = 0;
            if (pw.length >= 6) score++;
            if (pw.length >= 10) score++;
            if (/[A-Z]/.test(pw)) score++;
            if (/[0-9]/.test(pw)) score++;
            if (/[^A-Za-z0-9]/.test(pw)) score++;
            return score;
        }

        function updateStrength() {
            const pw = passwordInput.value;
            if (!pw) {
                strengthWrap.classList.add('hidden');
                return;
            }
            strengthWrap.classList.remove('hidden');
            const score = getStrength(pw);
            strengthFill.className = 'm-strength-bar-fill';
            if (score <= 1) {
                strengthFill.classList.add('weak');
                strengthText.textContent = 'Weak';
                strengthText.style.color = '#f43f5e';
            } else if (score === 2) {
                strengthFill.classList.add('fair');
                strengthText.textContent = 'Fair';
                strengthText.style.color = '#f59e0b';
            } else if (score <= 4) {
                strengthFill.classList.add('good');
                strengthText.textContent = 'Good';
                strengthText.style.color = '#22c55e';
            } else {
                strengthFill.classList.add('strong');
                strengthText.textContent = 'Strong';
                strengthText.style.color = '#10b981';
            }
        }

        function updateMatch() {
            const pw = passwordInput.value;
            const vp = verifyInput.value;
            if (!vp) {
                matchIndicator.classList.add('hidden');
                return;
            }
            matchIndicator.classList.remove('hidden');
            if (pw === vp) {
                matchIndicator.textContent = '✓ Passwords match';
                matchIndicator.style.color = '#10b981';
            } else {
                matchIndicator.textContent = '✗ Passwords do not match';
                matchIndicator.style.color = '#f43f5e';
            }
        }

        if (passwordInput) passwordInput.addEventListener('input', updateStrength);
        if (verifyInput) verifyInput.addEventListener('input', updateMatch);

        // Step indicator animation on focus
        const allInputs = document.querySelectorAll('#register-form input');
        const stepBars = document.querySelectorAll('.step-bar');
        allInputs.forEach(input => {
            input.addEventListener('focus', () => {
                const idx = Array.from(allInputs).indexOf(input);
                const step = idx < 2 ? 1 : idx < 3 ? 2 : 3;
                stepBars.forEach(bar => {
                    const s = parseInt(bar.dataset.step);
                    bar.style.background = s <= step ? '#6366f1' : '#e2e8f0';
                });
            });
        });
    </script>
</body>
</html>
