<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - Church E-Voting System</title>
</head>
<body class="bg-cosmic-dark flex items-center justify-center min-h-screen py-12 px-4 sm:px-6 lg:px-8 relative overflow-hidden">
    <!-- Ambient Background Glows -->
    <div class="glow-aura w-[350px] h-[350px] bg-indigo-500/10 top-[-50px] right-[-50px] animate-glow-pulse"></div>
    <div class="glow-aura w-[300px] h-[300px] bg-violet-600/10 bottom-[-50px] left-[-50px] animate-glow-pulse" style="animation-delay: -3s;"></div>

    <div class="max-w-md w-full space-y-8 glass-panel-dark p-8 sm:p-10 rounded-5xl animate-fade-in relative z-10">
        <div>
            <a href="/" class="inline-flex items-center text-sm font-bold text-slate-400 hover:text-white transition duration-300 mb-6">
                <svg class="mr-2 w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18"></path></svg>
                Back to Home
            </a>
            <h2 class="text-3xl font-black text-white tracking-tight">
                Register to Vote
            </h2>
            <p class="mt-2 text-sm text-slate-400">
                Already have an account?
                <a href="/pages/login.html" class="font-bold text-church-400 hover:text-church-300 transition duration-300">
                    Sign in
                </a>
            </p>
        </div>
        
        <!-- Alerts dynamically styled in JS -->
        <div id="alert-container" class="hidden rounded-2xl p-4 mb-4 border transition-all duration-300 text-sm font-semibold">
            <div class="flex items-center space-x-2.5">
                <div class="flex-shrink-0" id="alert-icon-container">
                    <!-- Dynamic Alert Icon -->
                </div>
                <div class="flex-1">
                    <p id="alert-message" class="leading-snug"></p>
                </div>
            </div>
        </div>

        <form id="register-form" class="mt-8 space-y-6">
            <div class="space-y-4">
                <div class="grid grid-cols-2 gap-4">
                    <div class="relative">
                        <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none text-slate-400">
                            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"></path></svg>
                        </div>
                        <label for="first-name" class="sr-only">First Name</label>
                        <input id="first-name" name="first_name" type="text" required class="premium-input-dark pl-11" placeholder="First Name">
                    </div>
                    <div class="relative">
                        <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none text-slate-400">
                            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"></path></svg>
                        </div>
                        <label for="last-name" class="sr-only">Last Name</label>
                        <input id="last-name" name="last_name" type="text" required class="premium-input-dark pl-11" placeholder="Last Name">
                    </div>
                </div>
                <div class="relative">
                    <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none text-slate-400">
                        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 12a4 4 0 10-8 0 4 4 0 008 0zm0 0v1.5a2.5 2.5 0 005 0V12a9 9 0 10-9 9m4.5-1.206a8.959 8.959 0 01-4.5 1.206"></path></svg>
                    </div>
                    <label for="email-address" class="sr-only">Email address</label>
                    <input id="email-address" name="email" type="email" autocomplete="email" required class="premium-input-dark pl-12" placeholder="Email address">
                </div>
                <div class="relative">
                    <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none text-slate-400">
                        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"></path></svg>
                    </div>
                    <label for="password" class="sr-only">Create Password</label>
                    <input id="password" name="password" type="password" required class="premium-input-dark pl-12" placeholder="Create Password">
                </div>
                <div class="relative">
                    <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none text-slate-400">
                        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"></path></svg>
                    </div>
                    <label for="verify-password" class="sr-only">Verify Password</label>
                    <input id="verify-password" name="verify_password" type="password" required class="premium-input-dark pl-12" placeholder="Verify Password">
                </div>
            </div>

            <div>
                <button type="submit" id="submit-btn" class="w-full flex justify-center py-4 px-6 rounded-full text-base font-bold text-white bg-gradient-to-r from-church-600 to-church-500 hover:from-church-500 hover:to-church-400 shadow-premium hover:shadow-premium-lg transition-all duration-300 active:scale-95">
                    Complete Registration
                </button>
            </div>
        </form>
    </div>

    <script type="module" src="/src/js/auth.js"></script>
    <script type="module" src="/src/main.js"></script>
</body>
</html>
