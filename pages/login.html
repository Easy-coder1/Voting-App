<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Church E-Voting System</title>
</head>
<body class="bg-gray-50 flex items-center justify-center min-h-screen py-12 px-4 sm:px-6 lg:px-8">
    <div class="max-w-md w-full space-y-8 bg-white p-10 rounded-[2.5rem] shadow-soft-lg border border-gray-100 animate-fade-in">
        <div>
            <a href="/" class="inline-flex items-center text-sm font-bold text-gray-400 hover:text-church-600 transition mb-4">
                <svg class="mr-2 w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18"></path></svg>
                Back to Home
            </a>
            <h2 class="mt-2 text-center text-3xl font-extrabold text-gray-900 tracking-tight">
                Welcome Back
            </h2>
            <p class="mt-2 text-center text-sm text-gray-600">
                Or
                <a href="/pages/register.html" class="font-medium text-church-600 hover:text-church-500 transition">
                    register a new account
                </a>
            </p>
        </div>
        
        <div id="alert-container" class="hidden rounded-md p-4 mb-4">
            <div class="flex">
                <div class="ml-3">
                    <p id="alert-message" class="text-sm font-medium"></p>
                </div>
            </div>
        </div>

        <form id="login-form" class="mt-8 space-y-6">
            <div class="space-y-4">
                <div>
                    <label for="email-address" class="sr-only">Email address</label>
                    <input id="email-address" name="email" type="email" autocomplete="email" required class="appearance-none block w-full px-5 py-4 bg-gray-100 border border-transparent rounded-2xl placeholder-gray-500 text-gray-900 focus:outline-none focus:ring-2 focus:ring-church-500 focus:bg-white transition-colors sm:text-base" placeholder="Email address">
                </div>
                <div>
                    <label for="password" class="sr-only">Password</label>
                    <input id="password" name="password" type="password" autocomplete="current-password" required class="appearance-none block w-full px-5 py-4 bg-gray-100 border border-transparent rounded-2xl placeholder-gray-500 text-gray-900 focus:outline-none focus:ring-2 focus:ring-church-500 focus:bg-white transition-colors sm:text-base" placeholder="Password">
                </div>
            </div>

            <div>
                <button type="submit" id="submit-btn" class="w-full flex justify-center py-4 px-6 border border-transparent text-base font-bold rounded-full text-white bg-church-600 hover:bg-church-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-church-500 transition-all active:scale-95">
                    Sign in
                </button>
            </div>
        </form>
    </div>

    <script type="module" src="/src/js/auth.js"></script>
    <script type="module" src="/src/main.js"></script>
</body>
</html>
