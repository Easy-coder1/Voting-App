<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard - Church E-Voting System</title>
</head>
<body class="bg-gray-100 font-sans flex h-screen overflow-hidden">
    <!-- Desktop Sidebar -->
    <aside class="w-64 bg-church-800 text-white flex-col hidden md:flex z-50">
        <div class="h-20 flex items-center justify-center border-b border-church-700">
            <img src="/images/NUTFS.png" alt="Logo" class="h-8 w-auto rounded bg-white p-1 mr-2">
            <span class="text-xl font-extrabold tracking-tight">Admin Panel</span>
        </div>
        <nav class="flex-grow py-6 px-4 space-y-3">
            <button data-tab="analytics" class="tab-btn w-full flex items-center px-4 py-2 bg-church-900 rounded-md transition">
                <span>Analytics</span>
            </button>
            <button data-tab="members" class="tab-btn w-full flex items-center px-4 py-2 hover:bg-church-700 rounded-md transition">
                <span>Members</span>
            </button>
            <button data-tab="elections" class="tab-btn w-full flex items-center px-4 py-2 hover:bg-church-700 rounded-md transition">
                <span>Elections</span>
            </button>
            <button data-tab="candidates" class="tab-btn w-full flex items-center px-4 py-2 hover:bg-church-700 rounded-md transition">
                <span>Candidates</span>
            </button>
        </nav>
        <div class="p-4 border-t border-church-700">
            <button id="logout-btn" class="w-full bg-church-700 hover:bg-church-600 text-white py-3 rounded-xl font-bold transition active:scale-95">Logout</button>
        </div>
    </aside>

    <!-- Mobile Bottom Navigation -->
    <nav class="fixed bottom-0 w-full bg-white border-t border-gray-100 flex justify-around items-center md:hidden pb-safe z-50 shadow-[0_-4px_20px_rgba(0,0,0,0.05)] pt-2 pb-4">
        <button data-tab="analytics" class="tab-btn flex flex-col items-center p-2 text-church-600 transition">
            <span class="text-xs font-bold mt-1">Analytics</span>
        </button>
        <button data-tab="members" class="tab-btn flex flex-col items-center p-2 text-gray-400 hover:text-church-600 transition">
            <span class="text-xs font-bold mt-1">Members</span>
        </button>
        <button data-tab="elections" class="tab-btn flex flex-col items-center p-2 text-gray-400 hover:text-church-600 transition">
            <span class="text-xs font-bold mt-1">Elections</span>
        </button>
        <button data-tab="candidates" class="tab-btn flex flex-col items-center p-2 text-gray-400 hover:text-church-600 transition">
            <span class="text-xs font-bold mt-1">Candidates</span>
        </button>
    </nav>

    <!-- Main Content -->
    <main class="flex-1 flex flex-col h-screen overflow-y-auto pb-24 md:pb-0">
        <!-- Top Header -->
        <header class="bg-white/90 backdrop-blur-md shadow-sm h-20 flex items-center justify-between px-6 sticky top-0 z-40 border-b border-gray-100">
            <h2 id="page-title" class="text-2xl font-extrabold text-gray-900 tracking-tight">Analytics Dashboard</h2>
            <div class="flex items-center space-x-4">
                <span class="text-sm text-gray-600">Admin: <span id="admin-name" class="font-bold">...</span></span>
            </div>
        </header>

        <!-- Content Area -->
        <div class="p-6">
            <!-- Analytics Tab -->
            <div id="tab-analytics" class="tab-content space-y-8">
                <!-- Stat Cards -->
                <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-6">
                    <div class="bg-white p-8 rounded-[2rem] shadow-soft border border-gray-50 relative overflow-hidden">
                        <div class="absolute top-0 left-0 w-full h-1 bg-blue-500"></div>
                        <p class="text-sm text-gray-500 font-bold uppercase tracking-wider mb-2">Total Members</p>
                        <p id="stat-total-members" class="text-4xl font-black text-gray-900">0</p>
                    </div>
                    <div class="bg-white p-8 rounded-[2rem] shadow-soft border border-gray-50 relative overflow-hidden">
                        <div class="absolute top-0 left-0 w-full h-1 bg-yellow-500"></div>
                        <p class="text-sm text-gray-500 font-bold uppercase tracking-wider mb-2">Pending</p>
                        <p id="stat-pending" class="text-4xl font-black text-gray-900">0</p>
                    </div>
                    <div class="bg-white p-8 rounded-[2rem] shadow-soft border border-gray-50 relative overflow-hidden">
                        <div class="absolute top-0 left-0 w-full h-1 bg-green-500"></div>
                        <p class="text-sm text-gray-500 font-bold uppercase tracking-wider mb-2">Approved</p>
                        <p id="stat-approved" class="text-4xl font-black text-gray-900">0</p>
                    </div>
                    <div class="bg-white p-8 rounded-[2rem] shadow-soft border border-gray-50 relative overflow-hidden">
                        <div class="absolute top-0 left-0 w-full h-1 bg-purple-500"></div>
                        <p class="text-sm text-gray-500 font-bold uppercase tracking-wider mb-2">Votes Cast</p>
                        <p id="stat-votes" class="text-4xl font-black text-gray-900">0</p>
                    </div>
                </div>

                <!-- Charts -->
                <div class="grid grid-cols-1 lg:grid-cols-2 gap-8">
                    <div class="bg-white p-8 rounded-[2rem] shadow-soft">
                        <h3 class="text-xl font-extrabold text-gray-900 mb-6 tracking-tight">Voter Turnout</h3>
                        <canvas id="turnoutChart" height="250"></canvas>
                    </div>
                    <div class="bg-white p-8 rounded-[2rem] shadow-soft">
                        <h3 class="text-xl font-extrabold text-gray-900 mb-6 tracking-tight">Live Election Status</h3>
                        <div id="live-election-status" class="text-sm text-gray-600 bg-gray-50 p-6 rounded-2xl">
                            Loading...
                        </div>
                    </div>
                </div>
            </div>

            <!-- Members Tab -->
            <div id="tab-members" class="tab-content hidden space-y-8">
                <div class="bg-white rounded-[2rem] shadow-soft overflow-hidden border border-gray-50">
                    <div class="px-8 py-6 border-b border-gray-100 flex justify-between items-center bg-gray-50">
                        <h3 class="text-xl font-extrabold text-gray-900 tracking-tight">Member Management</h3>
                    </div>
                    <div class="overflow-x-auto">
                        <table class="w-full text-left border-collapse">
                            <thead>
                                <tr class="bg-gray-50 text-gray-600 text-sm border-b">
                                    <th class="px-6 py-3 font-medium">Name</th>
                                    <th class="px-6 py-3 font-medium">Email</th>
                                    <th class="px-6 py-3 font-medium">Status</th>
                                    <th class="px-6 py-3 font-medium">Voting Rights</th>
                                    <th class="px-6 py-3 font-medium">Actions</th>
                                </tr>
                            </thead>
                            <tbody id="members-table-body" class="text-sm text-gray-700 divide-y divide-gray-200">
                                <!-- Populated by JS -->
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>

            <!-- Elections Tab -->
            <div id="tab-elections" class="tab-content hidden space-y-8">
                <div class="bg-white rounded-[2rem] shadow-soft p-8 border border-gray-50">
                    <h3 class="text-xl font-extrabold text-gray-900 mb-6 tracking-tight">Create Election</h3>
                    <form id="create-election-form" class="space-y-6 max-w-xl">
                        <div>
                            <label class="block text-sm font-bold text-gray-700 mb-2">Title</label>
                            <input type="text" id="el-title" required class="block w-full rounded-xl bg-gray-50 border-transparent px-4 py-3 focus:ring-2 focus:ring-church-500 focus:bg-white transition">
                        </div>
                        <div class="grid grid-cols-1 sm:grid-cols-2 gap-6">
                            <div>
                                <label class="block text-sm font-bold text-gray-700 mb-2">Start Date</label>
                                <input type="datetime-local" id="el-start" required class="block w-full rounded-xl bg-gray-50 border-transparent px-4 py-3 focus:ring-2 focus:ring-church-500 focus:bg-white transition">
                            </div>
                            <div>
                                <label class="block text-sm font-bold text-gray-700 mb-2">End Date</label>
                                <input type="datetime-local" id="el-end" required class="block w-full rounded-xl bg-gray-50 border-transparent px-4 py-3 focus:ring-2 focus:ring-church-500 focus:bg-white transition">
                            </div>
                        </div>
                        <button type="submit" class="bg-church-600 text-white px-6 py-4 rounded-full font-bold hover:bg-church-700 shadow-soft transition-all active:scale-95">Create Election</button>
                    </form>
                </div>

                <div class="bg-white rounded-[2rem] shadow-soft overflow-hidden border border-gray-50">
                    <div class="px-8 py-6 border-b border-gray-100 bg-gray-50">
                        <h3 class="text-xl font-extrabold text-gray-900 tracking-tight">Manage Elections</h3>
                    </div>
                    <div class="overflow-x-auto p-6">
                        <div id="elections-list" class="space-y-4">
                            <!-- Populated by JS -->
                        </div>
                    </div>
                </div>
            </div>

            <!-- Candidates Tab -->
            <div id="tab-candidates" class="tab-content hidden space-y-8">
                <div class="bg-white rounded-[2rem] shadow-soft p-8 border border-gray-50">
                    <h3 class="text-xl font-extrabold text-gray-900 mb-6 tracking-tight">Add Candidate</h3>
                    <form id="add-candidate-form" class="space-y-6 max-w-xl">
                        <div>
                            <label class="block text-sm font-bold text-gray-700 mb-2">Full Name</label>
                            <input type="text" id="can-name" required class="block w-full rounded-xl bg-gray-50 border-transparent px-4 py-3 focus:ring-2 focus:ring-church-500 focus:bg-white transition">
                        </div>
                        <div>
                            <label class="block text-sm font-bold text-gray-700 mb-2">Position</label>
                            <select id="can-position" required class="block w-full rounded-xl bg-gray-50 border-transparent px-4 py-3 focus:ring-2 focus:ring-church-500 focus:bg-white transition">
                                <!-- Populated by JS -->
                            </select>
                        </div>
                        <div>
                            <label class="block text-sm font-bold text-gray-700 mb-2">Photo URL (Optional)</label>
                            <input type="url" id="can-photo" class="block w-full rounded-xl bg-gray-50 border-transparent px-4 py-3 focus:ring-2 focus:ring-church-500 focus:bg-white transition">
                        </div>
                        <button type="submit" class="bg-church-600 text-white px-6 py-4 rounded-full font-bold hover:bg-church-700 shadow-soft transition-all active:scale-95">Add Candidate</button>
                    </form>
                </div>

                <div class="bg-white rounded-[2rem] shadow-soft overflow-hidden border border-gray-50">
                    <div class="px-8 py-6 border-b border-gray-100 bg-gray-50">
                        <h3 class="text-xl font-extrabold text-gray-900 tracking-tight">Manage Candidates</h3>
                    </div>
                    <div class="overflow-x-auto p-6">
                        <div id="candidates-list" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-4">
                            <!-- Populated by JS -->
                        </div>
                    </div>
                </div>
            </div>

        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script type="module" src="/src/js/admin.js"></script>
    <script type="module" src="/src/main.js"></script>
</body>
</html>
