<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard - Church E-Voting System</title>
</head>
<body class="bg-slate-50 flex h-screen overflow-hidden relative">
    <!-- Desktop Sidebar -->
    <aside class="w-64 bg-slate-950 text-white flex-col hidden md:flex z-50 border-r border-slate-900">
        <div class="h-20 flex items-center px-6 border-b border-slate-900 space-x-3">
            <img src="/images/NUTFS.png" alt="Logo" class="h-8 w-auto rounded bg-white p-1">
            <span class="text-lg font-black tracking-tight bg-gradient-to-r from-church-400 to-indigo-300 bg-clip-text text-transparent">Admin Panel</span>
        </div>
        <nav class="flex-grow py-6 px-4 space-y-2">
            <button data-tab="analytics" class="tab-btn w-full flex items-center space-x-3 px-4 py-3 rounded-2xl bg-church-600 text-white font-semibold transition-all duration-300">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 01-2 2h-2a2 2 0 01-2-2z"></path></svg>
                <span>Analytics</span>
            </button>
            <button data-tab="members" class="tab-btn w-full flex items-center space-x-3 px-4 py-3 rounded-2xl text-slate-400 hover:text-white hover:bg-slate-900 font-semibold transition-all duration-300">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4.354a4 4 0 110 5.292M15 21H3v-1a6 6 0 0112 0v1zm0 0h6v-1a6 6 0 00-9-5.197M13 7a4 4 0 11-8 0 4 4 0 018 0z"></path></svg>
                <span>Members</span>
            </button>
            <button data-tab="elections" class="tab-btn w-full flex items-center space-x-3 px-4 py-3 rounded-2xl text-slate-400 hover:text-white hover:bg-slate-900 font-semibold transition-all duration-300">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2m-3 7h3m-3 4h3m-6-4h.01M9 16h.01"></path></svg>
                <span>Elections</span>
            </button>
            <button data-tab="candidates" class="tab-btn w-full flex items-center space-x-3 px-4 py-3 rounded-2xl text-slate-400 hover:text-white hover:bg-slate-900 font-semibold transition-all duration-300">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"></path></svg>
                <span>Candidates</span>
            </button>
        </nav>
        <div class="p-4 border-t border-slate-900">
            <button id="logout-btn" class="w-full bg-slate-900 hover:bg-slate-800 text-slate-200 hover:text-white py-3.5 rounded-2xl font-bold border border-slate-850 transition active:scale-95">Logout</button>
        </div>
    </aside>

    <!-- Mobile Bottom Navigation Tab Bar (Clean, App-like, visual) -->
    <nav class="fixed bottom-0 w-full bg-white/90 backdrop-blur-md border-t border-slate-100 flex justify-around items-center md:hidden pb-safe z-50 shadow-[0_-8px_30px_rgba(0,0,0,0.03)] pt-2 pb-4">
        <button data-tab="analytics" class="tab-btn flex flex-col items-center p-2 text-church-600 transition duration-300">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 01-2 2h-2a2 2 0 01-2-2z"></path></svg>
            <span class="text-[10px] font-bold mt-1">Analytics</span>
        </button>
        <button data-tab="members" class="tab-btn flex flex-col items-center p-2 text-slate-400 hover:text-church-600 transition duration-300">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4.354a4 4 0 110 5.292M15 21H3v-1a6 6 0 0112 0v1zm0 0h6v-1a6 6 0 00-9-5.197M13 7a4 4 0 11-8 0 4 4 0 018 0z"></path></svg>
            <span class="text-[10px] font-bold mt-1">Members</span>
        </button>
        <button data-tab="elections" class="tab-btn flex flex-col items-center p-2 text-slate-400 hover:text-church-600 transition duration-300">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2m-3 7h3m-3 4h3m-6-4h.01M9 16h.01"></path></svg>
            <span class="text-[10px] font-bold mt-1">Elections</span>
        </button>
        <button data-tab="candidates" class="tab-btn flex flex-col items-center p-2 text-slate-400 hover:text-church-600 transition duration-300">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"></path></svg>
            <span class="text-[10px] font-bold mt-1">Candidates</span>
        </button>
    </nav>

    <!-- Main Content -->
    <main class="flex-1 flex flex-col h-screen overflow-y-auto pb-24 md:pb-0 relative z-10">
        <!-- Top Header -->
        <header class="bg-white/80 backdrop-blur-md shadow-sm h-20 flex items-center justify-between px-6 sticky top-0 z-40 border-b border-slate-100">
            <h2 id="page-title" class="text-2xl font-black text-slate-900 tracking-tight bg-gradient-to-r from-slate-900 to-slate-700 bg-clip-text">Analytics</h2>
            <div class="flex items-center space-x-3">
                <div class="flex items-center space-x-2.5">
                    <div id="admin-avatar-badge" class="w-8 h-8 rounded-full bg-gradient-to-tr from-slate-800 to-slate-650 text-white flex items-center justify-center text-xs font-bold shadow-sm uppercase">A</div>
                    <span class="text-sm text-slate-600 hidden sm:block">Admin: <span id="admin-name" class="font-bold text-slate-900">...</span></span>
                </div>
                <!-- Mini mobile logout -->
                <button id="logout-btn-mob" class="bg-slate-100 text-slate-700 hover:bg-slate-200 p-2 rounded-full md:hidden border border-slate-250 transition active:scale-95" onclick="document.getElementById('logout-btn').click()">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"></path></svg>
                </button>
            </div>
        </header>

        <!-- Content Area -->
        <div class="p-6 max-w-7xl w-full mx-auto space-y-8 pb-32 md:pb-8">
            <!-- Analytics Tab -->
            <div id="tab-analytics" class="tab-content space-y-8">
                <!-- Stat Cards -->
                <div class="grid grid-cols-2 lg:grid-cols-4 gap-4 sm:gap-6">
                    <div class="bg-white p-5 sm:p-6 rounded-3xl shadow-premium border border-slate-100 relative overflow-hidden transition-all duration-300 hover:shadow-premium-lg">
                        <div class="absolute top-0 left-0 w-full h-1 bg-indigo-500"></div>
                        <div class="flex justify-between items-start mb-3">
                            <span class="text-xs text-slate-400 font-bold uppercase tracking-wider">Total Members</span>
                            <span class="p-1.5 bg-indigo-50 rounded-lg text-indigo-500">
                                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 20h5v-2a3 3 0 00-5.356-1.857M17 20H7m10 0v-2c0-.656-.126-1.283-.356-1.857M7 20H2v-2a3 3 0 015.356-1.857M7 20v-2c0-.656.126-1.283.356-1.857m0 0a5.002 5.002 0 019.288 0M15 7a3 3 0 11-6 0 3 3 0 016 0zm6 3a2 2 0 11-4 0 2 2 0 014 0zM7 10a2 2 0 11-4 0 2 2 0 014 0z"></path></svg>
                            </span>
                        </div>
                        <p id="stat-total-members" class="text-2xl sm:text-3xl font-black text-slate-900">0</p>
                    </div>
                    <div class="bg-white p-5 sm:p-6 rounded-3xl shadow-premium border border-slate-100 relative overflow-hidden transition-all duration-300 hover:shadow-premium-lg">
                        <div class="absolute top-0 left-0 w-full h-1 bg-amber-500"></div>
                        <div class="flex justify-between items-start mb-3">
                            <span class="text-xs text-slate-400 font-bold uppercase tracking-wider">Pending</span>
                            <span class="p-1.5 bg-amber-50 rounded-lg text-amber-500">
                                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
                            </span>
                        </div>
                        <p id="stat-pending" class="text-2xl sm:text-3xl font-black text-slate-900">0</p>
                    </div>
                    <div class="bg-white p-5 sm:p-6 rounded-3xl shadow-premium border border-slate-100 relative overflow-hidden transition-all duration-300 hover:shadow-premium-lg">
                        <div class="absolute top-0 left-0 w-full h-1 bg-emerald-500"></div>
                        <div class="flex justify-between items-start mb-3">
                            <span class="text-xs text-slate-400 font-bold uppercase tracking-wider">Approved</span>
                            <span class="p-1.5 bg-emerald-50 rounded-lg text-emerald-500">
                                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
                            </span>
                        </div>
                        <p id="stat-approved" class="text-2xl sm:text-3xl font-black text-slate-900">0</p>
                    </div>
                    <div class="bg-white p-5 sm:p-6 rounded-3xl shadow-premium border border-slate-100 relative overflow-hidden transition-all duration-300 hover:shadow-premium-lg">
                        <div class="absolute top-0 left-0 w-full h-1 bg-violet-500"></div>
                        <div class="flex justify-between items-start mb-3">
                            <span class="text-xs text-slate-400 font-bold uppercase tracking-wider">Votes Cast</span>
                            <span class="p-1.5 bg-violet-50 rounded-lg text-violet-500">
                                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2m-3 7h3m-3 4h3m-6-4h.01M9 16h.01"></path></svg>
                            </span>
                        </div>
                        <p id="stat-votes" class="text-2xl sm:text-3xl font-black text-slate-900">0</p>
                    </div>
                </div>

                <!-- Charts -->
                <div class="grid grid-cols-1 lg:grid-cols-2 gap-8">
                    <div class="bg-white p-6 sm:p-8 rounded-3xl shadow-premium border border-slate-100">
                        <h3 class="text-xl font-bold text-slate-900 mb-6 tracking-tight">Voter Turnout</h3>
                        <div class="relative h-[250px]">
                            <canvas id="turnoutChart"></canvas>
                        </div>
                    </div>
                    <div class="bg-white p-6 sm:p-8 rounded-3xl shadow-premium border border-slate-100 flex flex-col justify-between">
                        <div>
                            <h3 class="text-xl font-bold text-slate-900 mb-6 tracking-tight">Live Election Status</h3>
                            <div id="live-election-status" class="text-sm text-slate-650 bg-slate-50 border border-slate-100 p-6 rounded-2xl">
                                <div class="flex items-center space-x-2 animate-pulse text-slate-400">
                                    <div class="w-2.5 h-2.5 rounded-full bg-slate-350"></div>
                                    <span>Syncing Live Election status</span>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Members Tab -->
            <div id="tab-members" class="tab-content hidden space-y-8 animate-fade-in">
                <div class="bg-white rounded-3xl shadow-premium overflow-hidden border border-slate-100">
                    <div class="px-6 py-5 border-b border-slate-100 flex justify-between items-center bg-slate-50/50">
                        <h3 class="text-lg font-bold text-slate-900 tracking-tight">Member Management</h3>
                    </div>
                    <div class="overflow-x-auto">
                        <table class="w-full text-left border-collapse min-w-[700px]">
                            <thead>
                                <tr class="bg-slate-50/80 text-slate-400 text-xs font-bold uppercase tracking-wider border-b border-slate-100">
                                    <th class="px-6 py-4">Name</th>
                                    <th class="px-6 py-4">Email</th>
                                    <th class="px-6 py-4">Account Status</th>
                                    <th class="px-6 py-4">Voting Rights</th>
                                    <th class="px-6 py-4">Actions</th>
                                </tr>
                            </thead>
                            <tbody id="members-table-body" class="text-sm text-slate-700 divide-y divide-slate-100 font-semibold">
                                <!-- Populated by JS -->
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>

            <!-- Elections Tab -->
            <div id="tab-elections" class="tab-content hidden space-y-8 animate-fade-in">
                <div class="bg-white rounded-3xl shadow-premium p-6 sm:p-8 border border-slate-100">
                    <h3 class="text-xl font-bold text-slate-900 mb-6 tracking-tight">Create Election</h3>
                    <form id="create-election-form" class="space-y-5 max-w-xl">
                        <div>
                            <label class="block text-xs font-bold uppercase tracking-wider text-slate-400 mb-2">Title</label>
                            <input type="text" id="el-title" required class="premium-input bg-slate-50" placeholder="e.g. 2026 Deacon Election">
                        </div>
                        <div class="grid grid-cols-1 sm:grid-cols-2 gap-5">
                            <div>
                                <label class="block text-xs font-bold uppercase tracking-wider text-slate-400 mb-2">Start Date</label>
                                <input type="datetime-local" id="el-start" required class="premium-input bg-slate-50">
                            </div>
                            <div>
                                <label class="block text-xs font-bold uppercase tracking-wider text-slate-400 mb-2">End Date</label>
                                <input type="datetime-local" id="el-end" required class="premium-input bg-slate-50">
                            </div>
                        </div>
                        <button type="submit" class="bg-gradient-to-r from-church-600 to-church-500 hover:from-church-500 hover:to-church-400 text-white px-6 py-4 rounded-full font-bold hover:shadow-premium transition-all duration-300 active:scale-95">Create Election</button>
                    </form>
                </div>

                <div class="bg-white rounded-3xl shadow-premium border border-slate-100 overflow-hidden">
                    <div class="px-6 py-5 border-b border-slate-100 bg-slate-50/50">
                        <h3 class="text-lg font-bold text-slate-900 tracking-tight">Manage Elections</h3>
                    </div>
                    <div class="p-6">
                        <div id="elections-list" class="space-y-4">
                            <!-- Populated by JS -->
                        </div>
                    </div>
                </div>
            </div>

            <!-- Candidates Tab -->
            <div id="tab-candidates" class="tab-content hidden space-y-8 animate-fade-in">
                <div class="bg-white rounded-3xl shadow-premium p-6 sm:p-8 border border-slate-100">
                    <h3 class="text-xl font-bold text-slate-900 mb-6 tracking-tight">Add Candidate</h3>
                    <form id="add-candidate-form" class="space-y-5 max-w-xl">
                        <div>
                            <label class="block text-xs font-bold uppercase tracking-wider text-slate-400 mb-2">Full Name</label>
                            <input type="text" id="can-name" required class="premium-input bg-slate-50" placeholder="e.g. John Doe">
                        </div>
                        <div>
                            <label class="block text-xs font-bold uppercase tracking-wider text-slate-400 mb-2">Position</label>
                            <select id="can-position" required class="premium-input bg-slate-50 cursor-pointer">
                                <!-- Populated by JS -->
                            </select>
                        </div>
                        <div>
                            <label class="block text-xs font-bold uppercase tracking-wider text-slate-400 mb-2">Photo URL (Optional)</label>
                            <input type="url" id="can-photo" class="premium-input bg-slate-50" placeholder="https://example.com/photo.jpg">
                        </div>
                        <button type="submit" class="bg-gradient-to-r from-church-600 to-church-500 hover:from-church-500 hover:to-church-400 text-white px-6 py-4 rounded-full font-bold hover:shadow-premium transition-all duration-300 active:scale-95">Add Candidate</button>
                    </form>
                </div>

                <div class="bg-white rounded-3xl shadow-premium border border-slate-100 overflow-hidden">
                    <div class="px-6 py-5 border-b border-slate-100 bg-slate-50/50">
                        <h3 class="text-lg font-bold text-slate-900 tracking-tight">Manage Candidates</h3>
                    </div>
                    <div class="p-6">
                        <div id="candidates-list" class="grid grid-cols-2 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-4 sm:gap-6">
                            <!-- Populated by JS -->
                        </div>
                    </div>
                </div>
            </div>

        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script type="module" src="/src/js/admin.js"></script>
    <script type="module" src="/src/main.js"></script>
</body>
</html>
