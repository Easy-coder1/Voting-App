<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Set new password — NUTFS UCC Chapter E‑Voting</title>
    <link rel="icon" type="image/png" href="/images/NUTFS.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body class="bg-canvas min-h-screen flex">

    <main class="flex-1 flex items-center justify-center px-6 py-12">
        <div class="w-full max-w-[400px] animate-fade-in">
            <div class="mb-8 flex justify-center">
                <a href="/"><img src="/images/NUTFS.png" alt="NUTFS" class="h-12"></a>
            </div>

            <h2 class="font-display text-[2rem] font-semibold text-ink tracking-tight leading-none">Set a new password</h2>
            <p class="mt-2.5 text-sm text-ink-muted">
                Choose a new password for your account.
            </p>

            <div id="alert-container" class="hidden mt-6 rounded-xl p-4 border flex items-start gap-3">
                <span id="alert-icon-container" class="shrink-0 mt-0.5"></span>
                <span id="alert-message" class="text-sm font-medium leading-relaxed"></span>
            </div>

            <form id="reset-password-form" class="mt-8 space-y-5 hidden">
                <div class="relative m-field" id="field-password">
                    <input id="new-password" name="password" type="password" autocomplete="new-password" required minlength="6" placeholder=" " data-password-input class="peer pr-12">
                    <label for="new-password">New password</label>
                    <button type="button" data-password-toggle class="absolute inset-y-0 right-0 z-10 pr-4 flex items-center text-ink-subtle hover:text-ink" aria-label="Show password">
                        <svg class="w-5 h-5 pointer-events-none" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"/>
                        </svg>
                    </button>
                </div>
                <div class="relative m-field" id="field-verify">
                    <input id="verify-password" name="verify" type="password" autocomplete="new-password" required minlength="6" placeholder=" " data-password-input class="peer pr-12">
                    <label for="verify-password">Confirm new password</label>
                </div>
                <button type="submit" id="submit-btn" class="w-full btn-wine py-3.5 text-base mt-2">
                    <span id="submit-btn-text">Update password</span>
                    <svg id="submit-btn-spinner" class="hidden w-5 h-5 animate-spin" fill="none" viewBox="0 0 24 24">
                        <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"/><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4z"/>
                    </svg>
                </button>
            </form>

            <div id="reset-loading" class="mt-10 flex flex-col items-center gap-3 text-ink-muted text-sm font-semibold">
                <svg class="w-6 h-6 animate-spin text-church-600" fill="none" viewBox="0 0 24 24">
                    <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"/><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4z"/>
                </svg>
                Verifying your reset link…
            </div>
        </div>
    </main>

    <script type="module" src="/src/js/reset-password.js"></script>
    <script type="module" src="/src/main.js"></script>
</body>
</html>
