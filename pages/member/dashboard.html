<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Member Dashboard - Church E-Voting System</title>
</head>
<body class="bg-gray-50 flex flex-col min-h-screen">
    <!-- Navbar -->
    <nav class="bg-white/90 backdrop-blur-lg border-b border-gray-100 sticky top-0 z-40">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between h-20 items-center">
                <div class="flex items-center">
                    <img src="/images/NUTFS.png" alt="Church Logo" class="h-10 w-auto rounded-lg">
                    <span class="ml-3 text-xl font-extrabold text-gray-900 tracking-tight">E-Voting</span>
                </div>
                <div class="flex items-center space-x-4">
                    <span id="user-name" class="text-gray-600 text-sm font-medium hidden sm:block">Loading...</span>
                    <button id="logout-btn" class="bg-gray-100 text-gray-700 hover:bg-gray-200 px-4 py-2 rounded-full text-sm font-bold transition active:scale-95">Logout</button>
                </div>
            </div>
        </div>
    </nav>

    <!-- Main Content -->
    <main class="flex-grow max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8 w-full">
        <!-- Status Banner -->
        <div id="status-banner" class="hidden rounded-md p-4 mb-6 text-sm font-medium shadow-sm">
        </div>

        <div class="grid grid-cols-1 lg:grid-cols-3 gap-8">
            <!-- Sidebar (Election Info & Countdown) -->
            <div class="lg:col-span-1 space-y-6">
                <div class="bg-white rounded-[2rem] shadow-soft p-8 relative overflow-hidden">
                    <div class="absolute top-0 left-0 w-full h-2 bg-church-500"></div>
                    <h3 class="text-xl font-extrabold text-gray-900 mb-4 tracking-tight">Election Info</h3>
                    <div id="election-info" class="text-sm text-gray-500 space-y-3">
                        <p>Loading election data...</p>
                    </div>
                </div>

                <div class="bg-white rounded-[2rem] shadow-soft p-8 relative overflow-hidden">
                    <div class="absolute top-0 left-0 w-full h-2 bg-gold-500"></div>
                    <h3 class="text-xl font-extrabold text-gray-900 mb-4 tracking-tight">Progress</h3>
                    <ul id="progress-list" class="text-sm space-y-3 font-medium text-gray-600">
                        <!-- Populated by JS -->
                    </ul>
                </div>
            </div>

            <!-- Main Panel (Ballot or Results) -->
            <div class="lg:col-span-2">
                <div id="main-panel" class="bg-white rounded-[2.5rem] shadow-soft-lg p-8 sm:p-10 min-h-[400px]">
                    <h2 id="panel-title" class="text-3xl font-extrabold text-gray-900 border-b border-gray-100 pb-6 mb-8 tracking-tight">Welcome</h2>
                    
                    <div id="panel-content" class="space-y-10">
                        <!-- Dynamic Content (Ballot / Results / Empty State) -->
                        <div class="flex items-center justify-center h-48">
                            <div class="animate-spin rounded-full h-10 w-10 border-b-2 border-church-600"></div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <!-- Confirmation Modal (Bottom Sheet on Mobile) -->
    <div id="vote-modal" class="fixed inset-0 bg-gray-900/40 backdrop-blur-sm hidden flex-col justify-end sm:justify-center z-50 animate-fade-in">
        <div class="bg-white rounded-t-[2rem] sm:rounded-[2.5rem] p-8 w-full sm:max-w-sm mx-auto shadow-2xl pb-safe">
            <h3 class="text-2xl font-extrabold text-gray-900 mb-3 tracking-tight">Confirm Vote</h3>
            <p id="modal-text" class="text-base text-gray-500 mb-8 leading-relaxed"></p>
            <div class="flex flex-col sm:flex-row-reverse sm:space-x-reverse sm:space-x-3 gap-3">
                <button id="modal-confirm" class="w-full sm:w-auto px-6 py-4 bg-church-600 rounded-full text-base font-bold text-white shadow-soft hover:bg-church-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-church-500 transition-all active:scale-95">Confirm Vote</button>
                <button id="modal-cancel" class="w-full sm:w-auto px-6 py-4 bg-gray-100 rounded-full text-base font-bold text-gray-700 hover:bg-gray-200 focus:outline-none transition-all active:scale-95">Cancel</button>
            </div>
        </div>
    </div>

    <script type="module" src="/src/js/member.js"></script>
    <script type="module" src="/src/main.js"></script>
</body>
</html>
