<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Vote — NUTFS UCC Chapter E‑Voting</title>
    <link rel="icon" type="image/png" href="/images/NUTFS.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="./dashboard.css">
</head>
<body class="app vote-app">

    <header class="app-header vote-header">
        <div class="app-header-inner">
            <a href="/" class="app-brand">
                <img src="/images/NUTFS.png" alt="NUTFS UCC Chapter">
                <div class="app-brand-text">
                    <span class="app-brand-name">NUTFS UCC Chapter</span>
                    <span class="app-brand-tag">NUC · Secure Voting</span>
                </div>
            </a>
            <div class="app-header-actions">
                <div class="user-menu">
                    <button type="button" id="user-menu-btn" class="user-menu-trigger" aria-expanded="false" aria-haspopup="true" aria-label="Your profile">
                        <span id="user-avatar-initials" class="user-avatar-circle">…</span>
                    </button>
                    <div id="user-menu-popover" class="user-menu-popover" role="dialog" aria-label="Profile details">
                        <p id="user-menu-name" class="user-menu-name">Loading…</p>
                        <p id="user-menu-email" class="user-menu-email"></p>
                    </div>
                </div>
                <button id="logout-btn" class="btn-ghost btn-sign-out" type="button">
                    <svg class="btn-sign-out-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                        <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/>
                        <polyline points="16 17 21 12 16 7"/>
                        <line x1="21" y1="12" x2="9" y2="12"/>
                    </svg>
                    <span>Sign out</span>
                </button>
            </div>
        </div>
    </header>

    <main class="vote-page">
        <div id="eligibility-card" class="eligibility-card" role="status"></div>
        <div id="main-content" class="main-content">
            <div class="loading-block">
                <div class="spinner"></div>
                <span>Getting your ballot ready…</span>
            </div>
        </div>
    </main>

    <div id="confirm-modal" class="confirm-overlay" aria-hidden="true">
        <div class="confirm-dialog" role="dialog" aria-modal="true" aria-labelledby="confirm-title">
            <div class="confirm-dialog-head">
                <span class="confirm-step-badge">Step 2 of 3</span>
                <h2 id="confirm-title">Check your choices</h2>
                <p class="confirm-sub">Make sure everything looks right. After you submit, you cannot change your votes.</p>
            </div>
            <div id="confirm-list" class="confirm-list"></div>
            <div class="confirm-actions">
                <button type="button" id="confirm-cancel" class="btn-modal-secondary">Go back & edit</button>
                <button type="button" id="confirm-submit" class="btn-modal-primary">Yes, submit my votes</button>
            </div>
        </div>
    </div>

    <script type="module" src="/src/js/member.js"></script>
    <script type="module" src="/src/main.js"></script>
</body>
</html>
