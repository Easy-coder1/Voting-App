<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard — NUTFS E‑Voting</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=Outfit:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <!-- Removed standalone dashboard.css — using unified design system from style.css -->
</head>
<body>

    <!-- ═══ TOPBAR (WIMP: Menu bar with user dropdown) ═══ -->
    <nav class="app-topbar" role="navigation" aria-label="Dashboard navigation">
        <a href="/" class="app-topbar-brand">
            <img src="/images/NUTFS.png" alt="NUTFS Logo" width="32" height="32">
            <span class="app-topbar-brand-text">E‑Voting</span>
        </a>
        <div class="app-topbar-right">
            <div class="app-user-pill">
                <div id="user-avatar-badge" class="app-user-avatar">U</div>
                <span id="user-name" class="app-user-name">Loading…</span>
            </div>
            <button id="logout-btn" class="app-btn-ghost text-sm font-semibold hidden sm:inline-flex" aria-label="Sign out of your account">Sign out</button>
        </div>
    </nav>

    <!-- ═══ MAIN LAYOUT (WIMP: Sidebar + Main Panel window pattern) ═══ -->
    <main class="flex-1 relative z-10">
        <div class="max-w-5xl mx-auto w-full px-4 sm:px-6 lg:px-8 py-6 sm:py-8 lg:py-10">
            <div class="app-layout-grid">

                <!-- Alert Banner (WIMP: Notification bar) -->
                <div id="status-banner" class="app-alert app-alert-error items-center justify-between shadow-sm mb-6" role="alert">
                    <div class="flex items-center gap-3">
                        <div class="w-8 h-8 rounded-full bg-red-100 flex items-center justify-center flex-shrink-0 text-red-600">
                            <i data-lucide="alert-triangle" class="w-[18px] h-[18px]"></i>
                        </div>
                        <span>Your account is not approved for voting. Please contact the Election Committee.</span>
                    </div>
                    <button class="app-btn-ghost text-red-700 hover:bg-red-100 hover:text-red-800 text-xs px-3 py-1.5 h-auto min-h-0">Contact Support</button>
                </div>

                <!-- ═══ SIDEBAR ═══ -->
                <aside class="app-sidebar flex flex-col gap-4 fade-up" style="animation-delay:0.05s" aria-label="Election information sidebar">
                    <div class="app-card">
                        <div class="app-card-strip"></div>
                        <div class="app-card-header">
                            <div class="app-card-title">
                                <span class="app-card-dot" style="background:var(--brand)"></span>
                                <i data-lucide="calendar" class="w-4 h-4 ml-1 mr-0.5"></i>
                                Election
                            </div>
                        </div>
                        <div class="app-card-body">
                            <div id="election-info">
                                <div class="app-skeleton"><div class="app-spinner"></div></div>
                            </div>
                        </div>
                    </div>
                    <div class="app-card">
                        <div class="app-card-header">
                            <div class="app-card-title">
                                <span class="app-card-dot" style="background:var(--gold)"></span>
                                <i data-lucide="bar-chart" class="w-4 h-4 ml-1 mr-0.5"></i>
                                Your Progress
                            </div>
                        </div>
                        <div class="app-card-body">
                            <ul id="progress-list" class="app-stepper">
                                <li style="color:var(--text-3);font-size:13px;padding:8px 0">Loading positions…</li>
                            </ul>
                        </div>
                    </div>
                </aside>

                <!-- ═══ MAIN PANEL (WIMP: Content window) ═══ -->
                <section class="app-card app-main-panel fade-up" style="animation-delay:0.12s" aria-label="Main content">
                    <div class="app-card-header flex flex-col items-start gap-1" style="padding:22px 26px 16px">
                        <div class="flex items-center text-[10px] font-bold text-slate-400 uppercase tracking-widest mb-1">
                            <span class="text-slate-800">Home</span>
                            <i data-lucide="chevron-right" class="w-3 h-3 mx-1.5 opacity-50"></i>
                            <span class="text-church-600">Dashboard</span>
                        </div>
                        <h1 class="app-section-title">Overview</h1>
                    </div>
                    <div id="panel-content" class="app-card-body" style="padding:0 26px 28px">
                        <div class="app-skeleton">
                            <div class="app-spinner"></div>
                            <span style="font-size:12px;font-weight:600;color:var(--text-3);text-transform:uppercase;letter-spacing:0.08em">Loading ballot</span>
                        </div>
                    </div>
                </section>
            </div>
        </div>
    </main>

    <!-- ═══ MOBILE BOTTOM NAV (WIMP: Icon + label navigation) ═══ -->
    <nav class="app-bottom-nav" aria-label="Mobile navigation">
        <a href="/pages/member/dashboard.html" class="app-bottom-nav-item active group" aria-label="Dashboard home">
            <div class="w-14 h-8 flex items-center justify-center rounded-full mb-1 transition-colors duration-200 group-[.active]:bg-church-100 group-[.active]:text-church-600">
                <i data-lucide="home" class="w-[22px] h-[22px]"></i>
            </div>
            Home
        </a>
        <a href="/pages/member/voting.html" class="app-bottom-nav-item group" aria-label="Voting booth">
            <div class="w-14 h-8 flex items-center justify-center rounded-full mb-1 transition-colors duration-200 group-[.active]:bg-church-100 group-[.active]:text-church-600">
                <i data-lucide="file-text" class="w-[22px] h-[22px]"></i>
            </div>
            Vote
        </a>
        <button id="logout-btn-mobile" class="app-bottom-nav-item group" aria-label="Sign out">
            <div class="w-14 h-8 flex items-center justify-center rounded-full mb-1 transition-colors duration-200 group-hover:bg-red-50 group-hover:text-red-600">
                <i data-lucide="log-out" class="w-[22px] h-[22px]"></i>
            </div>
            Sign out
        </button>
    </nav>

    <!-- ═══ TOAST CONTAINER (WIMP: Notification center) ═══ -->
    <div id="toast-container" class="app-toast-container" aria-live="polite" aria-atomic="true"></div>

    <script type="module" src="/src/js/member.js"></script>
    <script type="module" src="/src/main.js"></script>
</body>
</html>
