<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Member Dashboard - NUTFS E-Voting System</title>
</head>
<body class="bg-slate-50 flex flex-col min-h-screen relative overflow-x-hidden">
    <!-- Ambient Background Glows -->
    <div class="glow-aura w-[350px] h-[350px] bg-indigo-200/30 top-[-100px] right-[-50px] animate-glow-pulse"></div>

    <!-- Navbar -->
    <nav class="bg-white/80 backdrop-blur-md border-b border-slate-100 sticky top-0 z-45 shadow-[0_1px_2px_rgba(0,0,0,0.01)]">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between h-20 items-center">
                <div class="flex items-center space-x-3">
                    <img src="/images/NUTFS.png" alt="Church Logo" class="h-10 w-auto rounded-lg">
                    <span class="text-xl font-black text-slate-900 tracking-tight bg-gradient-to-r from-church-700 to-church-500 bg-clip-text text-transparent">E-Voting</span>
                </div>
                <div class="flex items-center space-x-3.5">
                    <!-- User Avatar & Initials Dynamic Badge -->
                    <div class="flex items-center space-x-2.5">
                        <div id="user-avatar-badge" class="w-8 h-8 rounded-full bg-gradient-to-tr from-church-600 to-violet-500 text-white flex items-center justify-center text-xs font-bold shadow-sm uppercase">U</div>
                        <span id="user-name" class="text-slate-700 text-sm font-semibold hidden sm:block">Loading User...</span>
                    </div>
                    <button id="logout-btn" class="bg-slate-100 text-slate-700 hover:bg-slate-200 px-5 py-2.5 rounded-full text-sm font-bold transition duration-300 border border-slate-200/60 active:scale-95">Logout</button>
                </div>
            </div>
        </div>
    </nav>

    <!-- Main Content -->
    <main class="flex-grow max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8 w-full relative z-10">
        <!-- Status Banner -->
        <div id="status-banner" class="hidden rounded-2xl p-4 mb-6 text-sm font-semibold border shadow-sm transition-all duration-300">
        </div>

        <div class="grid grid-cols-1 lg:grid-cols-3 gap-8">
            <!-- Main Panel (Ballot or Results) - FIRST on mobile for better UX -->
            <div class="lg:col-span-2 order-first lg:order-last">
                <div id="main-panel" class="bg-white rounded-5xl border border-slate-100 shadow-premium p-6 sm:p-10 min-h-[450px] transition-all duration-300">
                    <h2 id="panel-title" class="text-3xl font-black text-slate-900 border-b border-slate-100 pb-6 mb-8 tracking-tight bg-gradient-to-r from-slate-900 to-slate-700 bg-clip-text">Welcome</h2>
                    
                    <div id="panel-content" class="space-y-10">
                        <!-- Dynamic Content (Ballot / Results / Empty State) -->
                        <div class="flex flex-col items-center justify-center h-64 space-y-3">
                            <div class="animate-spin rounded-full h-10 w-10 border-b-2 border-church-600"></div>
                            <span class="text-xs text-slate-400 font-semibold tracking-wider uppercase">Loading Ballot data</span>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Sidebar (Election Info & Countdown) - Below ballot on mobile -->
            <div class="lg:col-span-1 space-y-6 order-last lg:order-first">
                <!-- Election Info Card -->
                <div class="bg-white rounded-3xl border border-slate-100 shadow-premium p-6 sm:p-8 relative overflow-hidden transition-all duration-300 hover:shadow-premium-lg">
                    <div class="absolute top-0 left-0 w-full h-2 bg-gradient-to-r from-church-600 to-church-400"></div>
                    <h3 class="text-xl font-bold text-slate-900 mb-5 tracking-tight flex items-center space-x-2">
                        <svg class="w-5 h-5 text-church-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
                        <span>Election Info</span>
                    </h3>
                    <div id="election-info" class="text-sm text-slate-500 space-y-4">
                        <p class="animate-pulse">Loading election details...</p>
                    </div>
                </div>

                <!-- Progress Tracker Card -->
                <div class="bg-white rounded-3xl border border-slate-100 shadow-premium p-6 sm:p-8 relative overflow-hidden transition-all duration-300 hover:shadow-premium-lg">
                    <div class="absolute top-0 left-0 w-full h-2 bg-gradient-to-r from-gold-500 to-gold-300"></div>
                    <h3 class="text-xl font-bold text-slate-900 mb-5 tracking-tight flex items-center space-x-2">
                        <svg class="w-5 h-5 text-gold-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
                        <span>Voting Progress</span>
                    </h3>
                    <ul id="progress-list" class="text-sm space-y-3.5 font-semibold text-slate-650">
                        <!-- Populated by JS -->
                    </ul>
                </div>
            </div>
        </div>
    </main>



    <script type="module" src="/src/js/member.js"></script>
    <script type="module" src="/src/main.js"></script>
</body>
</html>
