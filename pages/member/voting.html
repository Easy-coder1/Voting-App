<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Voting Booth — NUTFS E‑Voting</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=Outfit:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <!-- Removed standalone voting.css — using unified design system from style.css -->
</head>
<body>

    <!-- ═══ TOPBAR ═══ -->
    <nav class="app-topbar" role="navigation" aria-label="Voting booth navigation">
        <div class="flex items-center gap-2">
            <a href="/pages/member/dashboard.html" class="app-btn-ghost inline-flex" aria-label="Back to dashboard">
                <i data-lucide="arrow-left" class="w-4 h-4"></i>
                Dashboard
            </a>
        </div>
        <div class="app-topbar-right">
            <div class="app-user-pill">
                <div id="user-avatar-badge" class="app-user-avatar">U</div>
                <span id="user-name" class="app-user-name">Loading…</span>
            </div>
        </div>
    </nav>

    <!-- ═══ MAIN ═══ -->
    <main class="flex-1 relative z-10">
        <div class="max-w-4xl mx-auto w-full px-4 sm:px-6 py-6 sm:py-8 lg:py-10 pb-safe" style="padding-bottom:calc(80px + env(safe-area-inset-bottom, 0px))">
            
            <!-- Breadcrumb Header -->
            <div class="mb-6 fade-up">
                <div class="flex items-center text-[10px] font-bold text-slate-400 uppercase tracking-widest mb-1.5">
                    <a href="/pages/member/dashboard.html" class="hover:text-church-600 transition-colors">Home</a>
                    <i data-lucide="chevron-right" class="w-3 h-3 mx-1.5 opacity-50"></i>
                    <span class="text-slate-800">Voting Booth</span>
                </div>
                <h1 class="app-section-title">Official Ballot</h1>
            </div>

            <div id="status-banner" class="app-alert app-alert-success hidden items-center gap-3 shadow-sm mb-6 fade-up" role="alert" style="animation-delay: 0.11s">
                <div class="w-8 h-8 rounded-full bg-emerald-100 flex items-center justify-center flex-shrink-0 text-emerald-600">
                    <i data-lucide="check" class="w-[18px] h-[18px]"></i>
                </div>
                <span id="status-msg" class="font-medium text-emerald-900"></span>
            </div>

            <div class="app-card overflow-hidden fade-up mb-8" style="animation-delay: 0.2s">
                <div class="app-card-header bg-gradient-to-r from-church-600 to-church-500 text-white p-6 sm:p-8 border-b-0 relative overflow-hidden">
                    <div class="absolute inset-0 bg-[url('https://www.transparenttextures.com/patterns/cubes.png')] opacity-10 mix-blend-overlay"></div>
                    <h2 class="text-xl font-bold font-heading relative z-10 flex items-center gap-3">
                        <div class="w-10 h-10 rounded-xl bg-white/20 backdrop-blur-sm flex items-center justify-center">
                            <i data-lucide="check-circle" class="w-6 h-6"></i>
                        </div>
                        <span id="election-title-sub">NUTFS General Election</span>
                    </h2>
                    <p class="text-church-50 text-sm mt-3 relative z-10 max-w-lg">Please carefully select your preferred candidate for each position. Your ballot is end-to-end encrypted and completely anonymous.</p>
                </div>
                
                <div class="bg-slate-50 border-t border-slate-100 p-6 flex flex-col sm:flex-row items-center justify-between gap-4">
                    <div class="text-sm font-bold text-slate-500 w-full sm:w-auto text-center sm:text-left">
                        <span id="booth-progress-text">0 selected</span> <span class="text-slate-400 font-normal">out of all positions</span>
                    </div>
                    <button id="submit-vote-btn" class="app-btn-primary w-full sm:w-auto min-w-[200px] h-[52px] relative overflow-hidden group">
                        <span id="submit-btn-text" class="group-hover:-translate-y-10 transition-transform duration-300 block">Cast Ballot Securely</span>
                        <span class="absolute inset-0 flex items-center justify-center translate-y-10 group-hover:translate-y-0 transition-transform duration-300 bg-church-600 font-bold">
                            Confirm & Submit <i data-lucide="arrow-right" class="w-4 h-4 ml-2"></i>
                        </span>
                        <i data-lucide="loader-2" id="submit-btn-spinner" class="hidden w-5 h-5 ml-2 animate-spin relative z-20"></i>
                    </button>
                </div>
            </div>

            <div id="panel-content">
                <div class="app-skeleton">
                    <div class="app-spinner"></div>
                    <span style="font-size:12px;font-weight:600;color:var(--text-3);text-transform:uppercase;letter-spacing:0.08em">Loading ballot</span>
                </div>
            </div>
        </div>
    </main>

    <!-- ═══ MOBILE BOTTOM ACTION BAR (WIMP: Fixed toolbar) ═══ -->
    <div class="app-action-bar" id="mobile-action-bar">
        <span class="text-sm font-semibold text-slate-600" id="action-bar-text">0 selected</span>
        <button class="app-btn-primary text-sm px-5 py-2.5" id="action-bar-submit" disabled>Submit</button>
    </div>

    <!-- ═══ CONFIRMATION MODAL (WIMP: Dialog window) ═══ -->
    <div class="app-overlay" id="vote-modal" role="dialog" aria-modal="true" aria-label="Confirm your votes">
        <div class="app-modal">
            <div class="app-modal-handle" aria-hidden="true"></div>
            <div class="app-modal-header">
                <h3 class="app-modal-title">Confirm All Votes</h3>
            </div>
            <div class="app-modal-body">
                <div id="modal-text"></div>
            </div>
            <div class="app-modal-footer">
                <button id="modal-confirm" class="app-btn-primary flex-1 relative overflow-hidden">Confirm & Submit</button>
                <button id="modal-cancel" class="app-btn-secondary flex-1">Review Again</button>
            </div>
        </div>
    </div>

    <div id="templates" style="display:none;">
        <!-- Position Block Template -->
        <template id="tpl-position-block">
            <div class="app-card mb-8 overflow-hidden fade-up">
                <div class="app-card-header bg-slate-50 border-b border-slate-100 flex items-center justify-between p-5">
                    <div class="app-card-title m-0">
                        <div class="w-8 h-8 rounded-lg bg-church-100 text-church-600 flex items-center justify-center mr-3">
                            <i data-lucide="user-check" class="w-4 h-4"></i>
                        </div>
                        <span class="pos-title text-base sm:text-lg text-slate-800"></span>
                    </div>
                    <span class="text-[10px] font-bold text-slate-400 uppercase tracking-wider bg-white px-2.5 py-1 rounded-md border border-slate-200">Select 1</span>
                </div>
                <div class="app-card-body p-6 bg-slate-50/30">
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-4 cand-list"></div>
                </div>
            </div>
        </template>

        <!-- Candidate Radio Template -->
        <template id="tpl-candidate-radio">
            <label class="block cursor-pointer relative group">
                <input type="radio" class="cand-input peer sr-only" name="">
                <div class="flex items-center p-4 rounded-xl border-2 border-slate-200 bg-white transition-all peer-checked:border-church-600 peer-checked:bg-church-50/50 peer-checked:shadow-sm hover:border-church-300 hover:shadow-sm min-h-[84px] active:scale-[0.98]">
                    <div class="flex-shrink-0 w-6 h-6 rounded-full border-2 border-slate-300 mr-4 flex items-center justify-center transition-colors peer-checked:border-church-600 peer-checked:bg-church-600 group-hover:border-church-400">
                        <i data-lucide="check" class="w-3.5 h-3.5 text-white opacity-0 peer-checked:opacity-100 transition-opacity"></i>
                    </div>
                    <div class="flex-1 min-w-0 pr-3">
                        <p class="font-bold text-slate-900 cand-name peer-checked:text-church-900 text-[15px] truncate"></p>
                        <p class="cand-manifesto block text-xs text-slate-500 mt-0.5 line-clamp-2 leading-relaxed opacity-90"></p>
                    </div>
                    <div class="w-10 h-10 rounded-full bg-slate-100 flex-shrink-0 ml-auto border border-slate-200 flex items-center justify-center text-slate-400 overflow-hidden shadow-inner">
                        <i data-lucide="user" class="w-5 h-5"></i>
                    </div>
                </div>
            </label>
        </template>
    </div>

    <!-- ═══ TOAST CONTAINER (WIMP: Notification center) ═══ -->
    <div id="toast-container" class="app-toast-container" aria-live="polite" aria-atomic="true"></div>

    <script type="module" src="/src/js/voting.js"></script>
    <script type="module" src="/src/main.js"></script>
</body>
</html>
