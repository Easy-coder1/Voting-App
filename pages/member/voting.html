<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Voting Booth - Church E-Voting System</title>
</head>
<body class="bg-slate-50 flex flex-col min-h-screen relative overflow-x-hidden">
    <!-- Ambient Background Glows -->
    <div class="glow-aura w-[350px] h-[350px] bg-indigo-200/30 top-[-100px] right-[-50px] animate-glow-pulse"></div>

    <!-- Navbar -->
    <nav class="bg-white/80 backdrop-blur-md border-b border-slate-100 sticky top-0 z-45 shadow-[0_1px_2px_rgba(0,0,0,0.01)]">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between h-20 items-center">
                <div class="flex items-center space-x-3">
                    <a href="/pages/member/dashboard.html" class="inline-flex items-center text-sm font-bold text-slate-500 hover:text-slate-900 transition duration-300">
                        <svg class="mr-2 w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18"></path></svg>
                        Exit Voting Booth
                    </a>
                </div>
                <div class="flex items-center space-x-3">
                    <div class="flex items-center space-x-2.5">
                        <div id="user-avatar-badge" class="w-8 h-8 rounded-full bg-gradient-to-tr from-church-600 to-violet-500 text-white flex items-center justify-center text-xs font-bold shadow-sm uppercase">U</div>
                        <span id="user-name" class="text-slate-700 text-sm font-semibold hidden sm:block">Loading...</span>
                    </div>
                </div>
            </div>
        </div>
    </nav>

    <!-- Main Content -->
    <main class="flex-grow max-w-4xl mx-auto px-4 sm:px-6 lg:px-8 py-8 w-full relative z-10">
        <!-- Status Banner -->
        <div id="status-banner" class="hidden rounded-2xl p-4 mb-6 text-sm font-semibold border shadow-sm transition-all duration-300">
        </div>

        <div id="voting-panel" class="bg-white rounded-5xl border border-slate-100 shadow-premium p-6 sm:p-10 min-h-[450px] transition-all duration-300">
            <div class="flex flex-col sm:flex-row sm:items-center sm:justify-between border-b border-slate-100 pb-6 mb-8 gap-4">
                <div>
                    <h2 id="panel-title" class="text-3xl font-black text-slate-900 tracking-tight bg-gradient-to-r from-slate-900 to-slate-700 bg-clip-text">Voting Booth</h2>
                    <p id="election-title-sub" class="text-sm text-slate-400 font-semibold mt-1">Loading active election...</p>
                </div>
                <!-- Mini Progress Tracker inside the booth -->
                <div class="bg-slate-50 border border-slate-100 px-4 py-2.5 rounded-2xl flex items-center space-x-3 text-sm font-bold text-slate-700">
                    <span class="text-xs text-slate-400 font-bold uppercase tracking-wider">Progress</span>
                    <span id="booth-progress-text">-- / --</span>
                </div>
            </div>
            
            <div id="panel-content" class="space-y-10">
                <!-- Dynamic Ballot Content (Ballot / Empty State) -->
                <div class="flex flex-col items-center justify-center h-64 space-y-3">
                    <div class="animate-spin rounded-full h-10 w-10 border-b-2 border-church-600"></div>
                    <span class="text-xs text-slate-400 font-semibold tracking-wider uppercase">Loading Ballot Data</span>
                </div>
            </div>
        </div>
    </main>

    <!-- Confirmation Modal -->
    <div id="vote-modal" class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm hidden items-end sm:items-center justify-center z-50 animate-fade-in p-0 sm:p-4">
        <div class="bg-white rounded-t-[2.5rem] sm:rounded-3xl p-8 w-full sm:max-w-md shadow-2xl pb-safe border-t border-slate-100 sm:border animate-slide-up sm:animate-fade-in">
            <div class="w-12 h-1 bg-slate-200 rounded-full mx-auto mb-6 sm:hidden"></div>
            
            <h3 class="text-2xl font-black text-slate-900 mb-3 tracking-tight">Confirm Vote</h3>
            <p id="modal-text" class="text-sm text-slate-500 mb-8 leading-relaxed"></p>
            <div class="flex flex-col sm:flex-row-reverse sm:space-x-reverse sm:space-x-3 gap-3">
                <button id="modal-confirm" class="w-full sm:w-auto px-6 py-4 bg-gradient-to-r from-church-600 to-church-500 hover:from-church-500 hover:to-church-400 rounded-full text-base font-bold text-white shadow-premium hover:shadow-premium-lg transition-all duration-300 active:scale-95">Confirm Vote</button>
                <button id="modal-cancel" class="w-full sm:w-auto px-6 py-4 bg-slate-100 rounded-full text-base font-bold text-slate-650 hover:bg-slate-200 transition-all duration-300 active:scale-95 border border-slate-200/40">Cancel</button>
            </div>
        </div>
    </div>

    <script type="module" src="/src/js/voting.js"></script>
    <script type="module" src="/src/main.js"></script>
</body>
</html>
