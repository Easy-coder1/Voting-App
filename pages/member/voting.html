<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Voting Booth — NUTFS E‑Voting</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=Outfit:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="./voting.css">
</head>
<body>

    <!-- TOPBAR -->
    <nav class="topbar">
        <div class="topbar-left">
            <a href="/pages/member/dashboard.html" class="topbar-back">
                <svg width="16" height="16" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18"/></svg>
                Dashboard
            </a>
        </div>
        <div class="topbar-right">
            <div class="user-pill">
                <div id="user-avatar-badge" class="user-avatar">U</div>
                <span id="user-name" class="user-name">Loading…</span>
            </div>
        </div>
    </nav>

    <!-- MAIN -->
    <main class="main-wrap">

        <!-- Alert Banner -->
        <div id="status-banner" class="alert-banner" role="alert"></div>

        <!-- Voting Panel -->
        <div class="card" style="min-height:450px">
            <div class="booth-header">
                <div>
                    <h2 class="booth-title" id="panel-title">Voting Booth</h2>
                    <p class="booth-sub" id="election-title-sub">Loading active election…</p>
                </div>
                <div class="booth-progress-pill">
                    <span>Progress</span>
                    <span id="booth-progress-text">— / —</span>
                </div>
            </div>
            <div class="booth-body" id="panel-content">
                <div class="skeleton">
                    <div class="spinner"></div>
                    <span style="font-size:12px;font-weight:600;color:var(--text-3);text-transform:uppercase;letter-spacing:0.08em">Loading ballot</span>
                </div>
            </div>
        </div>
    </main>

    <!-- MOBILE BOTTOM ACTION BAR -->
    <div class="action-bar" id="mobile-action-bar" style="display:none">
        <span class="action-bar-text" id="action-bar-text">0 selected</span>
        <button class="action-bar-btn" id="action-bar-submit" disabled>Submit</button>
    </div>

    <!-- CONFIRMATION MODAL -->
    <div class="overlay" id="vote-modal">
        <div class="modal">
            <div class="modal-handle"></div>
            <div class="modal-header">
                <h3 class="modal-title">Confirm All Votes</h3>
            </div>
            <div class="modal-body">
                <div id="modal-text"></div>
            </div>
            <div class="modal-footer">
                <button id="modal-confirm" class="btn-primary">Confirm & Submit</button>
                <button id="modal-cancel" class="btn-secondary">Review Again</button>
            </div>
        </div>
    </div>

    <script type="module" src="/src/js/voting.js"></script>
    <script type="module" src="/src/main.js"></script>
</body>
</html>
